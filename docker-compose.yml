version: '3.8'

services:
  backend:
    build:
      context: ./aegissoc/backend
      dockerfile: Dockerfile
    container_name: aegissoc-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/aegissoc.db
      - SANDBOX_MODE=true
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./aegissoc/frontend
      dockerfile: Dockerfile
    container_name: aegissoc-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
